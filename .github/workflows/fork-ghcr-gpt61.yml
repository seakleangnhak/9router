name: Build 9Router Fork Image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gpt-6-1-sol-ghcr

permissions:
  contents: read

concurrency:
  group: fork-ghcr-gpt61-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  routing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests --no-audit --no-fund
      - run: ./scripts/test-fork-routing.sh

  build-and-push:
    if: github.ref == 'refs/heads/codex/gpt-6-1-sol-ghcr'
    needs: routing-tests
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read app version
        id: version
        run: node -p "'version=' + require('./package.json').version + '-gpt-6.1-sol'" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=fork-ghcr-gpt61-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-ghcr-gpt61-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ env.GHCR_IMAGE }}:build-${{ github.run_id }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify runtime security fixes
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          timeout --kill-after=5s 90s docker run --rm \
            --network none --read-only --user node \
            --cpus 1 --memory 512m --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges \
            --ulimit cpu=45 --ulimit fsize=67108864 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/verify-runtime-security.mjs,target=/verify-runtime-security.mjs,readonly" \
            --entrypoint /usr/bin/env \
            "$GHCR_IMAGE@$IMAGE_DIGEST" \
            -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp \
            node /verify-runtime-security.mjs

      - name: Save verified digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: fork-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build-and-push
    permissions:
      packages: write
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.build-and-push.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        run: |
          set -euo pipefail
          amd64=$(cat "$RUNNER_TEMP/digests/amd64.txt")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64.txt")
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:latest" \
            --tag "$GHCR_IMAGE:gpt-6.2" \
            --tag "$GHCR_IMAGE:sha-$GITHUB_SHA" \
            --tag "$GHCR_IMAGE:gpt-6.1-sol" \
            --tag "$GHCR_IMAGE:$APP_VERSION" \
            --tag "$GHCR_IMAGE:gpt-6.1-sol-fix" \
            --tag "$GHCR_IMAGE:$APP_VERSION-fix" \
            "$GHCR_IMAGE@$amd64" \
            "$GHCR_IMAGE@$arm64"
