name: Build GPT-6.1 Sol Image

on:
  push:
    branches:
      - codex/gpt-6-1-sol-ghcr

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ghcr-gpt61-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=0.5.104-gpt-6.1-sol
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:gpt-6.1-sol
            ${{ env.GHCR_IMAGE }}:0.5.104-gpt-6.1-sol
            ${{ env.GHCR_IMAGE }}:gpt-6.1-sol-fix
            ${{ env.GHCR_IMAGE }}:0.5.104-gpt-6.1-sol-fix
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
