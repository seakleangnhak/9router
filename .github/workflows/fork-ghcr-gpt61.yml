name: Build GPT-6.1 Sol Image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/gpt-6-1-sol-ghcr

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-ghcr-gpt61-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=fork-ghcr-gpt61-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-ghcr-gpt61-${{ matrix.arch }}
          build-args: |
            APP_VERSION=0.5.116-gpt-6.1-sol
          tags: ${{ env.GHCR_IMAGE }}:build-${{ github.run_id }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify runtime security fixes
        run: |
          timeout --kill-after=5s 90s docker run --rm \
            --network none --read-only --user node \
            --cpus 1 --memory 512m --pids-limit 64 \
            --cap-drop ALL --security-opt no-new-privileges \
            --ulimit cpu=45 --ulimit fsize=67108864 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/verify-runtime-security.mjs,target=/verify-runtime-security.mjs,readonly" \
            --entrypoint /usr/bin/env \
            "$GHCR_IMAGE:build-${GITHUB_RUN_ID}-${{ matrix.arch }}" \
            -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/tmp TMPDIR=/tmp \
            node /verify-runtime-security.mjs

  publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image tags
        run: |
          docker buildx imagetools create \
            --tag "$GHCR_IMAGE:latest" \
            --tag "$GHCR_IMAGE:gpt-6.1-sol" \
            --tag "$GHCR_IMAGE:0.5.116-gpt-6.1-sol" \
            --tag "$GHCR_IMAGE:gpt-6.1-sol-fix" \
            --tag "$GHCR_IMAGE:0.5.116-gpt-6.1-sol-fix" \
            "$GHCR_IMAGE:build-${GITHUB_RUN_ID}-amd64" \
            "$GHCR_IMAGE:build-${GITHUB_RUN_ID}-arm64"
